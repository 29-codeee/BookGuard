<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="140" y="32" font-size="16" font-weight="700" fill="#0f172a">Zero-Oversell Resource Lock Invariant (E10)</text>
  <text x="140" y="48" font-size="12" fill="#64748b">Enforcement of resource capacity limits under simultaneous competitive booking requests</text>

  <!-- Legend -->
  <rect x="460" y="20" width="12" height="12" fill="#10b981" rx="2" />
