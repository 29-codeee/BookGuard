  <rect x="610" y="20" width="12" height="12" fill="#ef4444" rx="2" />
  <text x="628" y="30" font-size="11" fill="#334155" font-weight="500">Rejected</text>

  
      <text x="130" y="96" font-size="12" text-anchor="end" fill="#334155" font-weight="600">C5-N20</text>
